name: venice-design CI

# Layer-1 CI for the Venice Design fork. Runs on every push and PR:
#   * pnpm install (frozen lockfile)
#   * monorepo typecheck across all 12 workspaces
#   * vitest run on the daemon package (162 tests incl. 11 new Venice ones)
#   * media-models drift check (TS web registry vs daemon registry)
#
# Layer-2 / Layer-3 (real Venice API smoke) lives in
# tests/manual/venice-smoke.mjs and is opt-in — it needs a real
# VENICE_API_KEY secret and burns ~$0.20 in credits per run. Run it
# manually via `gh workflow run venice-smoke.yml` once configured (see
# the optional workflow file below if you want to wire it up).

on:
  push:
    branches: [main, fork/venice-design, feat/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs for the same ref so a force-push doesn't stack.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so git-based scripts (commit lookups, drift checks)
          # can resolve previous commits if needed.
          fetch-depth: 1

      # Node 24 matches the engines field in package.json. better-sqlite3
      # prebuilds for Node 24 on linux-x64 so we don't need a native build
      # toolchain in the runner.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Don't enable npm cache — pnpm has its own.

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm --version

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Workspace packages need their dist/ output before anything that
      # imports them via the workspace alias can typecheck. Build the
      # leaf packages first, then daemon/web pick up the .d.ts files.
      - name: Build workspace packages
        run: |
          pnpm --filter "@open-design/contracts" run build
          pnpm --filter "@open-design/registry-protocol" run build

      - name: Drift check — TS vs daemon media-models
        run: node scripts/verify-media-models.mjs

      - name: Monorepo typecheck
        run: pnpm -r --workspace-concurrency=4 --if-present run typecheck

      - name: Vitest — daemon
        run: pnpm --filter "@open-design/daemon" exec vitest run --reporter=verbose

      - name: Syntax-check manual smoke script
        run: node --check tests/manual/venice-smoke.mjs
