name: venice-smoke (real API)

# Layer-2 / Layer-3 integration smoke test against the real Venice API.
#
# WHEN: manual only. Triggered by `gh workflow run venice-smoke.yml` or
#       the "Run workflow" button in the Actions tab. Does NOT run on
#       push/PR because it burns ~$0.20 USD in Venice credits per run.
#
# REQUIRES: a `VENICE_API_KEY` repository secret. Configure it once at
#       https://github.com/<owner>/<repo>/settings/secrets/actions
#
# WHAT IT DOES: runs tests/manual/venice-smoke.mjs against the real
#       Venice API. Default flags: SKIP_VIDEO=1 (saves ~$0.40 + 60s
#       per run). Toggle the input below to run the full matrix.

on:
  workflow_dispatch:
    inputs:
      include_video:
        description: 'Include video generation step (~$0.40, ~60s)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      only_chat:
        description: 'Only run the multi-LLM tool-injection matrix (cheapest)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  smoke:
    name: real Venice API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
      SKIP_VIDEO: ${{ github.event.inputs.include_video == 'true' && '' || '1' }}
      ONLY_CHAT: ${{ github.event.inputs.only_chat == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify VENICE_API_KEY is set
        run: |
          if [ -z "$VENICE_API_KEY" ]; then
            echo "::error::VENICE_API_KEY secret is not configured."
            echo "Set it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 2
          fi
          echo "VENICE_API_KEY is set (length=${#VENICE_API_KEY})"

      - name: Run smoke test
        run: node tests/manual/venice-smoke.mjs

      # Upload the generated PNG / MP4 / MP3 artifacts so a maintainer can
      # eyeball what Venice actually rendered (failures would be hard to
      # diagnose otherwise). Files live in $TMPDIR/venice-smoke-* — we
      # collect them via the script's stdout-printed path.
      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venice-smoke-output
          path: |
            /tmp/venice-smoke-*/**
          if-no-files-found: warn
          retention-days: 7
